# Minecraft Bedrock server for console friends (port-forward setup)
#   bedrock   - official Bedrock Dedicated Server, NetherNet transport:
#               TCP 19132 handshake + UDP 19140-19149 gameplay (one port per player)
#   broadcast - MCXboxBroadcast: shows the server in consoles' Friends tab (ICE ports 19150-19159)
# Both use host networking: NetherNet (WebRTC-style) breaks behind Docker's extra NAT layer.
# Also set in data/server.properties: transport=nethernet and
#   server-udp-ports=PUBLIC-IP:19140-19149:19140-19149

services:
  bedrock:
    image: itzg/minecraft-bedrock-server:stable
    container_name: bedrock
    network_mode: host
    cap_add:
      - SYS_PTRACE    # lets ./mc send commands (send-command must find the server process)
    healthcheck:
      disable: true   # built-in check uses RakNet; a NetherNet server would always look "unhealthy"
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      TZ: "Etc/UTC"          # set to your time zone
      UID: "1000"
      GID: "1000"
      SERVER_NAME: "${SERVER_NAME}"
      LEVEL_NAME: "${LEVEL_NAME}"
      GAMEMODE: "survival"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "12"
      TICK_DISTANCE: "4"
      PLAYER_IDLE_TIMEOUT: "30"
      MAX_THREADS: "0"
      CLIENT_SIDE_CHUNK_GENERATION_ENABLED: "true"
      ONLINE_MODE: "true"
      ALLOW_LIST: "true"
      ALLOW_CHEATS: "false"
      DEFAULT_PLAYER_PERMISSION_LEVEL: "member"
      OPS: "${OPS}"
      ENABLE_LAN_VISIBILITY: "false"
      EMIT_SERVER_TELEMETRY: "false"
      STOP_SERVER_ANNOUNCE_DELAY: "10"
      TRANSPORT: "nethernet"
    volumes:
      - ./data:/data

  broadcast:
    image: ghcr.io/mcxboxbroadcast/standalone:latest
    container_name: broadcast
    network_mode: host
    restart: unless-stopped
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./xbox:/opt/app/config
    depends_on:
      - bedrock
